name: Build & Deploy Portfolio (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify_and_build:
    name: Verify, Export PDF & Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ats_resume_builder
        run: flutter pub get

      - name: Run static analysis
        working-directory: ats_resume_builder
        run: flutter analyze

      - name: Run unit and widget tests
        working-directory: ats_resume_builder
        run: flutter test

      - name: Export ATS Resume PDF
        working-directory: ats_resume_builder
        run: flutter test tool/export_ats_pdf.dart

      - name: Compute GitHub Pages BASE_HREF
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${OWNER,,}"
          REPO_LOWER="${REPO_NAME,,}"

          if [[ "$REPO_LOWER" == "${OWNER_LOWER}.github.io" ]]; then
            BASE_HREF="/resume-builder/"
          else
            BASE_HREF="/${REPO_NAME}/resume-builder/"
          fi

          echo "BASE_HREF=${BASE_HREF}" >> "$GITHUB_ENV"
          echo "Computed Flutter Web BASE_HREF: ${BASE_HREF}"

      - name: Build Flutter Web (release)
        working-directory: ats_resume_builder
        run: flutter build web --release --base-href "$BASE_HREF"

      - name: Assemble portfolio_website bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portfolio_website/resume-builder
          mkdir -p portfolio_website/resume-builder
          cp -a ats_resume_builder/build/web/. portfolio_website/resume-builder/
          touch portfolio_website/.nojekyll

          test -s portfolio_website/assets/Rahul_Deore_ATS_Resume.pdf
          test -s portfolio_website/resume-builder/index.html
          echo "Bundle verified: portfolio_website/ ready with latest PDF and Flutter Web app."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio_website

  deploy_production:
    name: Deploy to GitHub Pages
    needs: verify_and_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
