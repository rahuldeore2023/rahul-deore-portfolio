name: CI/CD & Production Deployment

on:
  push:
    branches:
      - main
      - dev
      - sit
      - uat
      - prod
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify_and_build:
    name: Verify, Export PDF & Build Web
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ats_resume_builder
        run: flutter pub get

      - name: Run static analysis
        working-directory: ats_resume_builder
        run: flutter analyze

      - name: Run unit and widget tests
        working-directory: ats_resume_builder
        run: flutter test

      - name: Export ATS Resume PDF
        working-directory: ats_resume_builder
        run: flutter test tool/export_ats_pdf.dart

      - name: Compute GitHub Pages BASE_HREF
        id: base_href
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${OWNER,,}"
          REPO_LOWER="${REPO_NAME,,}"

          if [[ "$REPO_LOWER" == "${OWNER_LOWER}.github.io" ]]; then
            BASE_HREF="/resume-builder/"
          else
            BASE_HREF="/${REPO_NAME}/resume-builder/"
          fi

          echo "BASE_HREF=${BASE_HREF}" >> "$GITHUB_ENV"
          echo "Detected repository: ${GITHUB_REPOSITORY}"
          echo "Computed Flutter Web BASE_HREF: ${BASE_HREF}"

      - name: Build Flutter Web (release)
        working-directory: ats_resume_builder
        run: flutter build web --release --base-href "$BASE_HREF"

      - name: Assemble portfolio_website bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portfolio_website/resume-builder
          mkdir -p portfolio_website/resume-builder
          cp -a ats_resume_builder/build/web/. portfolio_website/resume-builder/
          touch portfolio_website/.nojekyll

          test -s portfolio_website/assets/Rahul_Deore_ATS_Resume.pdf
          test -s portfolio_website/resume-builder/index.html
          echo "Bundle verified: portfolio_website/ ready with latest PDF and Flutter Web app."

      - name: Upload SIT/UAT preview artifact
        if: github.ref == 'refs/heads/sit' || github.ref == 'refs/heads/uat'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-${{ github.ref_name }}
          path: portfolio_website
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio_website

  deploy_production:
    name: Deploy to GitHub Pages (Production)
    needs: verify_and_build
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
