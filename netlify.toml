# Netlify Hosting Configuration for Rahul Deore Portfolio & ATS Resume Builder
# Ready for both Netlify Drop (drag-and-drop `portfolio_website/`) and Git-connected deploys.

[build]
  publish = "portfolio_website"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Ensure Flutter Web bootstrap, service worker, and entry HTML always check for updates
[[headers]]
  for = "/resume-builder/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/resume-builder/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/resume-builder/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/resume-builder/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/resume-builder/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Long-lived cache for versioned CanvasKit runtime files
[[headers]]
  for = "/resume-builder/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Moderate cache for Flutter web assets and icons
[[headers]]
  for = "/resume-builder/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/resume-builder/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Serve ATS Resume PDF with explicit content type and short revalidation cache
[[headers]]
  for = "/assets/Rahul_Deore_ATS_Resume.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=3600, must-revalidate"
